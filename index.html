<script>
const firebaseConfig = {
  apiKey: "AIzaSyA2wqin7hWuBc91RcNqTWl_BKShDqUxPSE",
  authDomain: "online-quiz-a7f40.firebaseapp.com",
  projectId: "online-quiz-a7f40",
  storageBucket: "online-quiz-a7f40.firebasestorage.app",
  messagingSenderId: "410078796989",
  appId: "1:410078796989:web:a8ad955ceef10ef348ebd4"
};

let db = null;
let dbReady = false;

const GRADES = [
  'Grade 1', 'Grade 2', 'Grade 3', 'Grade 4',
  'Grade 5', 'Grade 6', 'Grade 7', 'Grade 8',
  'Grade 9', 'Grade 10', 'Grade 11', 'Grade 12'
];

let state = {
  screen: 'home',
  err: '',
  studentMode: 'login',
  studentName: '',
  studentGrade: GRADES[0],
  studentSlug: '',
  exams: [],
  submissions: [],
  activeExam: null,
  currentAnswers: null,
  draftQuestions: [],
  newQ: { type: 'mcq', text: '', options: '', points: 10 },
  examDraft: { title: '', grade: '', duration: 120, isPrivate: false, password: '' },
  timerLeft: 0,
  timerInt: null,
  gradingSub: null,
  gradingScores: {},
  gradingCorrect: {},
  studentSearch: '',
  adminSearch: '',
  deleteTarget: null,
  examErr: {},
  unlockedExams: {},
  theme: 'light'
};

try {
  const session = JSON.parse(localStorage.getItem('exam_student_session') || 'null');
  if (session) {
    state.studentName = session.name;
    state.studentGrade = session.grade;
    state.studentSlug = session.slug;
  }
} catch (e) {
  // Session restore fallback
}

try {
  const savedTheme = localStorage.getItem('exam_theme');
  if (savedTheme) {
    state.theme = savedTheme;
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    state.theme = 'dark';
  }
} catch (e) {
  // Theme load fallback
}

document.documentElement.setAttribute('data-theme', state.theme);

function esc(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, function(char) {
    switch (char) {
      case '&': return '&amp;';
      case '<': return '&lt;';
      case '>': return '&gt;';
      case '"': return '&quot;';
      case "'": return '&#39;';
      default: return char;
    }
  });
}

function slugify(name) {
  return name
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '');
}

function gradeOptions(selectedGrade) {
  return GRADES.map(function(grade) {
    const isSelected = grade === selectedGrade ? 'selected' : '';
    return `<option value="${grade}" ${isSelected}>${grade}</option>`;
  }).join('');
}

function initials(name) {
  const cleanName = (name || '?').trim();
  const words = cleanName.split(/\s+/);
  return words
    .map(word => word[0])
    .slice(0, 2)
    .join('')
    .toUpperCase();
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  try {
    localStorage.setItem('exam_theme', state.theme);
  } catch (e) {}
  document.documentElement.setAttribute('data-theme', state.theme);
  render();
}

function renderNavbar() {
  const isAdminArea = ['adminLogin', 'adminDash', 'postExam', 'gradeSubmission'].includes(state.screen);
  const isStudentArea = ['studentDash', 'examTaking', 'submitted'].includes(state.screen) && state.studentName;
  
  let rightControls = `<button class="themebtn" title="Toggle theme" onclick="toggleTheme()">${state.theme === 'dark' ? '☀️' : '🌙'}</button>`;
  
  if (isStudentArea) {
    rightControls += `
      <div class="navavatar">
        <span class="avatar" style="margin:0">${initials(state.studentName)}</span>
        <div>
          <div class="nm">${esc(state.studentName)}</div>
          <span class="small">${esc(state.studentGrade)}</span>
        </div>
      </div>
      <a class="link" onclick="studentLogout()">Log out</a>
    `;
  } else if (isAdminArea) {
    rightControls += `
      <span class="pill sub">Admin</span>
      <a class="link" onclick="go('home')">Log out</a>
    `;
  } else {
    rightControls += `
      <button class="secondary" style="margin:0;padding:9px 16px;font-size:13px" onclick="go('adminLogin')">⚙️ Admin</button>
    `;
  }

  return `
    <div class="navbrand">
      <span class="ic">📚</span>
      <span>Teacher Exams</span>
    </div>
    <div class="navright">${rightControls}</div>
  `;
}

function render() {
  document.getElementById('navbar').innerHTML = renderNavbar();
  let contentHtml = views[state.screen]();
  
  if (state.deleteTarget) {
    contentHtml += `
      <div class="overlay">
        <div class="modal card">
          <div class="mic">🗑️</div>
          <h3>Delete this exam?</h3>
          <p class="small">This can't be undone. Students will no longer see it.</p>
          <button class="danger big" onclick="confirmDeleteExam()">Delete Exam</button>
          <button class="ghost big" onclick="state.deleteTarget=null;render();">Cancel</button>
        </div>
      </div>
    `;
  }
  
  document.getElementById('app').innerHTML = contentHtml;
}

function go(screenName) {
  state.screen = screenName;
  state.err = '';
  render();
}

function initDb() {
  try {
    if (firebaseConfig.apiKey === 'YOUR_API_KEY') {
      state.err = 'Firebase is not configured yet — open the file and paste your project config near the top of the script.';
      render();
      return;
    }
    
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    dbReady = true;

    db.collection('exams').onSnapshot(
      snap => {
        state.exams = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        render();
      },
      err => {
        state.err = 'Sync error: ' + (err.code || err.message);
        render();
      }
    );

    db.collection('submissions').onSnapshot(
      snap => {
        state.submissions = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        render();
      },
      err => {
        state.err = 'Sync error: ' + (err.code || err.message);
        render();
      }
    );
  } catch (e) {
    state.err = 'Could not connect to Firebase: ' + (e.message || e);
    render();
  }
}

function fmtTime(ms) {
  if (ms < 0) ms = 0;
  const totalSeconds = Math.floor(ms / 1000);
  const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
  const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
  const seconds = String(totalSeconds % 60).padStart(2, '0');
  return hours + ':' + minutes + ':' + seconds;
}

function draftKey(examId, slug) {
  return 'exam_draft_' + examId + '_' + slug;
}

function loadDraft(examId, slug) {
  try {
    return JSON.parse(localStorage.getItem(draftKey(examId, slug)) || 'null');
  } catch (e) {
    return null;
  }
}

function saveDraft(examId, slug, data) {
  try {
    localStorage.setItem(draftKey(examId, slug), JSON.stringify(data));
  } catch (e) {}
}

function clearDraft(examId, slug) {
  try {
    localStorage.removeItem(draftKey(examId, slug));
  } catch (e) {}
}

function studentSubStatus(exam) {
  return state.submissions.find(s => s.examId === exam.id && s.studentSlug === state.studentSlug) || null;
}

function unlockedKey() {
  return 'exam_unlocked_' + state.studentSlug;
}

function isUnlocked(examId) {
  if (state.unlockedExams[examId]) return true;
  try {
    const list = JSON.parse(localStorage.getItem(unlockedKey()) || '[]');
    return list.includes(examId);
  } catch (e) {
    return false;
  }
}

function markUnlocked(examId) {
  state.unlockedExams[examId] = true;
  try {
    const list = JSON.parse(localStorage.getItem(unlockedKey()) || '[]');
    if (!list.includes(examId)) {
      list.push(examId);
      localStorage.setItem(unlockedKey(), JSON.stringify(list));
    }
  } catch (e) {}
}

function unlockExam(examId) {
  const exam = state.exams.find(e => e.id === examId);
  const inputEl = document.getElementById('pw_' + examId);
  const enteredPassword = inputEl ? inputEl.value : '';

  if (exam && enteredPassword === exam.password) {
    markUnlocked(examId);
    state.examErr[examId] = '';
  } else {
    state.examErr[examId] = 'Incorrect password.';
  }
  render();
}

function computeAchievements() {
  const studentSubs = state.submissions.filter(s => s.studentSlug === state.studentSlug);
  const gradedSubs = studentSubs.filter(s => s.status === 'graded');
  const hasPerfectScore = gradedSubs.some(s => s.maxScore > 0 && s.totalScore === s.maxScore);
  
  const averageScore = gradedSubs.length
    ? gradedSubs.reduce((acc, s) => acc + (s.totalScore / (s.maxScore || 1)), 0) / gradedSubs.length * 100
    : 0;

  return [
    { icon: '🚀', label: 'First Exam', unlocked: studentSubs.length >= 1 },
    { icon: '🔥', label: '3 Exams', unlocked: studentSubs.length >= 3 },
    { icon: '🏆', label: 'Perfect Score', unlocked: hasPerfectScore },
    { icon: '⭐', label: 'High Achiever', unlocked: averageScore >= 90 && gradedSubs.length > 0 }
  ];
}

      <div class="card">
        ${questions.map((q, idx) => {
          const answerValue = submission.answers[q.id];
          let formattedAnswer = '';

          if (q.type === 'mcq') {
            formattedAnswer = q.options[answerValue] !== undefined ? esc(q.options[answerValue]) : '<i>No answer</i>';
          } else {
            formattedAnswer = answerValue ? esc(answerValue) : '<i>No answer</i>';
          }

          const markStatus = state.gradingCorrect[q.id];

          return `
            <div class="qbox">
              <p><span class="qnum">${idx + 1}</span><b>${q.points || 10} pts</b> — ${esc(q.text)}</p>
              <p class="small" style="background:var(--bg);padding:11px 13px;border-radius:12px">${formattedAnswer}</p>
              <div class="rowflex">
                <button class="toggle ${markStatus === true ? 'on-ok' : ''}" onclick="setCorrect('${q.id}', ${q.points || 10}, true)">✓ Correct (${q.points || 10} pts)</button>
                <button class="toggle ${markStatus === false ? 'on-bad' : ''}" onclick="setCorrect('${q.id}', ${q.points || 10}, false)">✗ Incorrect (0 pts)</button>
              </div>
            </div>
          `;
        }).join('')}

        <label>Feedback (optional)</label>
        <textarea id="fbText" placeholder="Feedback to student...">${esc(submission.feedback || '')}</textarea>
        ${state.err ? `<p class="err">${state.err}</p>` : ''}
        <button class="big" onclick="saveGrade()">Save Grade</button>
      </div>
    `;
  }
};

function setCorrect(questionId, points, isCorrect) {
  state.gradingCorrect[questionId] = isCorrect;
  state.gradingScores[questionId] = isCorrect ? points : 0;
  render();
}

async function studentSignupSubmit() {
  const nameInput = document.getElementById('sName').value.trim();
  const passwordInput = document.getElementById('sPass').value;
  const gradeInput = document.getElementById('sGrade').value;

  if (!nameInput || !passwordInput) {
    state.err = 'Please enter your name and a password.';
    render();
    return;
  }

  const slug = slugify(nameInput);
  if (!slug) {
    state.err = 'Please enter a valid name.';
    render();
    return;
  }

  if (!db) {
    state.err = 'Still connecting — please wait a moment and try again.';
    render();
    return;
  }

  try {
    const studentRef = db.doc('students/' + slug);
    const snap = await studentRef.get();

    if (snap.exists) {
      state.err = 'That name is already registered. Try logging in instead.';
      render();
      return;
    }

    await studentRef.set({
      name: nameInput,
      password: passwordInput,
      grade: gradeInput,
      createdAt: Date.now()
    });

    state.studentName = nameInput;
    state.studentGrade = gradeInput;
    state.studentSlug = slug;

    try {
      localStorage.setItem('exam_student_session', JSON.stringify({ name: nameInput, grade: gradeInput, slug: slug }));
    } catch (e) {}

    go('studentDash');
  } catch (e) {
    const reason = (e && (e.code || e.message)) || 'unknown error';
    state.err = 'Could not sign up: ' + reason;
    render();
  }
}

async function studentLoginSubmit() {
  const nameInput = document.getElementById('sName').value.trim();
  const passwordInput = document.getElementById('sPass').value;

  if (!nameInput || !passwordInput) {
    state.err = 'Please enter your name and password.';
    render();
    return;
  }

  const slug = slugify(nameInput);
  if (!db) {
    state.err = 'Still connecting — please wait a moment and try again.';
    render();
    return;
  }

  try {
    const snap = await db.doc('students/' + slug).get();
    if (!snap.exists) {
      state.err = 'No account found. Please sign up first.';
      render();
      return;
    }

    const data = snap.data();
    if (data.password !== passwordInput) {
      state.err = 'Incorrect password.';
      render();
      return;
    }

    state.studentName = data.name;
    state.studentGrade = data.grade;
    state.studentSlug = slug;

    try {
      localStorage.setItem('exam_student_session', JSON.stringify({ name: data.name, grade: data.grade, slug: slug }));
    } catch (e) {}

    go('studentDash');
  } catch (e) {
    const reason = (e && (e.code || e.message)) || 'unknown error';
    state.err = 'Could not log in: ' + reason;
    render();
  }
}

function studentLogout() {
  state.studentName = '';
  state.studentSlug = '';
  try {
    localStorage.removeItem('exam_student_session');
  } catch (e) {}
  go('home');
}

function adminLoginSubmit() {
  const usernameInput = document.getElementById('aUser').value;
  const passwordInput = document.getElementById('aPass').value;

  if (usernameInput === 'MRUSER' && passwordInput === 'MRPASSWORD') {
    go('adminDash');
  } else {
    state.err = 'Incorrect username or password.';
    render();
  }
}

function startPostExam() {
  state.draftQuestions = [];
  state.newQ = { type: 'mcq', text: '', options: '', points: 10 };
  state.examDraft = { title: '', grade: GRADES[0], duration: 120, isPrivate: false, password: '' };
  go('postExam');
}

function addQuestion() {
  const textVal = document.getElementById('qText').value.trim();
  const pointsVal = Number(document.getElementById('qPoints').value) || 10;
  const typeVal = document.getElementById('qType').value;

  if (!textVal) {
    state.err = 'Question text required.';
    render();
    return;
  }

  const question = {
    id: 'q' + Date.now() + Math.random().toString(36).slice(2, 7),
    type: typeVal,
    text: textVal,
    points: pointsVal
  };

  if (typeVal === 'mcq') {
    const optionsArr = document.getElementById('qOptions').value
      .split('\n')
      .map(str => str.trim())
      .filter(Boolean);

    if (optionsArr.length < 2) {
      state.err = 'Add at least 2 options.';
      render();
      return;
    }
    question.options = optionsArr;
  }

  state.draftQuestions.push(question);
  state.newQ = { type: 'mcq', text: '', options: '', points: 10 };
  state.err = '';
  render();
}

function removeQuestion(index) {
  state.draftQuestions.splice(index, 1);
  render();
}

async function publishExam() {
  const title = (state.examDraft.title || '').trim();
  const grade = state.examDraft.grade || GRADES[0];
  const duration = Number(state.examDraft.duration) || 120;
  const isPrivate = Boolean(state.examDraft.isPrivate);
  const password = (state.examDraft.password || '').trim();

  if (!title) {
    state.err = 'Title is required.';
    render();
    return;
  }

  if (state.draftQuestions.length === 0) {
    state.err = 'Add at least one question.';
    render();
    return;
  }

  if (isPrivate && !password) {
    state.err = 'Set a password for this private exam.';
    render();
    return;
  }

  if (!db) {
    state.err = 'Still connecting to storage — please wait a moment and try again.';
    render();
    return;
  }

  try {
    await db.collection('exams').add({
      title: title,
      grade: grade,
      durationMinutes: duration,
      questions: state.draftQuestions,
      isPrivate: isPrivate,
      password: isPrivate ? password : '',
      createdAt: Date.now()
    });
    go('adminDash');
  } catch (e) {
    const reason = (e && (e.code || e.message)) || 'unknown error';
    state.err = 'Could not save exam: ' + reason;
    render();
  }
}

function deleteExam(id) {
  state.deleteTarget = id;
  render();
}

async function confirmDeleteExam() {
  const targetId = state.deleteTarget;
  state.deleteTarget = null;

  try {
    await db.collection('exams').doc(targetId).delete();
  } catch (e) {
    const reason = (e && (e.code || e.message)) || 'unknown error';
    state.err = 'Could not delete exam: ' + reason;
  }
  render();
}

function startExam(examId) {
  const exam = state.exams.find(e => e.id === examId);
  const startedAt = Date.now();

  saveDraft(examId, state.studentSlug, { answers: {}, startedAt: startedAt });
  state.activeExam = exam;
  state.currentAnswers = {};

  beginTimer(exam, startedAt);
  go('examTaking');
}

function resumeExam(examId) {
  const exam = state.exams.find(e => e.id === examId);
  const draft = loadDraft(examId, state.studentSlug);

  state.activeExam = exam;
  state.currentAnswers = (draft && draft.answers) || {};

  beginTimer(exam, (draft && draft.startedAt) || Date.now());
  go('examTaking');
}

function beginTimer(exam, startedAt) {
  if (state.timerInt) {
    clearInterval(state.timerInt);
  }

  const durationMs = (exam.durationMinutes || 120) * 60000;

  function tick() {
    state.timerLeft = startedAt + durationMs - Date.now();

    if (state.timerLeft <= 0) {
      clearInterval(state.timerInt);
      submitExam(true);
    } else if (state.screen === 'examTaking') {
      const percentage = Math.max(0, Math.min(100, (state.timerLeft / durationMs) * 100));
      const isLow = state.timerLeft < 5 * 60 * 1000;

      document.querySelectorAll('.timer').forEach(el => {
        el.textContent = '⏱ ' + fmtTime(state.timerLeft);
        el.className = 'timer' + (isLow ? ' low' : '');
      });

      document.querySelectorAll('.tbar').forEach(el => {
        el.className = 'tbar' + (isLow ? ' low' : '');
        if (el.firstElementChild) {
          el.firstElementChild.style.width = percentage + '%';
        }
      });
    }
  }

  tick();
  state.timerInt = setInterval(tick, 1000);
}

function answerChanged(questionId, value) {
  if (!state.currentAnswers) {
    state.currentAnswers = {};
  }

  state.currentAnswers[questionId] = value;
  const elapsedTime = ((state.activeExam.durationMinutes || 120) * 60000) - state.timerLeft;

  saveDraft(state.activeExam.id, state.studentSlug, {
    answers: state.currentAnswers,
    startedAt: Date.now() - elapsedTime
  });
}

function saveAndExit() {
  if (state.timerInt) {
    clearInterval(state.timerInt);
  }
  go('studentDash');
}

async function submitExam(isAutoSubmit) {
  if (state.timerInt) {
    clearInterval(state.timerInt);
  }

  const exam = state.activeExam;
  const maxScore = exam.questions.reduce((acc, q) => acc + (q.points || 10), 0);

  try {
    await db.collection('submissions').add({
      examId: exam.id,
      examTitle: exam.title,
      studentSlug: state.studentSlug,
      studentName: state.studentName,
      studentGrade: state.studentGrade,
      answers: state.currentAnswers || {},
      submittedAt: Date.now(),
      status: 'submitted',
      perQuestion: {},
      totalScore: null,
      maxScore: maxScore,
      feedback: '',
      auto: Boolean(isAutoSubmit)
    });

    clearDraft(exam.id, state.studentSlug);
    go('submitted');
  } catch (e) {
    const reason = (e && (e.code || e.message)) || 'unknown error';
    state.err = 'Could not submit: ' + reason;
    render();
  }
}

function openGrade(submissionId) {
  const submission = state.submissions.find(s => s.id === submissionId);
  const exam = state.exams.find(e => e.id === submission.examId);

  state.gradingSub = submissionId;
  state.gradingScores = {};
  state.gradingCorrect = {};

  if (submission && submission.perQuestion && exam) {
    exam.questions.forEach(q => {
      const score = submission.perQuestion[q.id];
      if (score !== undefined) {
        state.gradingCorrect[q.id] = score >= (q.points || 10);
        state.gradingScores[q.id] = score;
      }
    });
  }

  go('gradeSubmission');
}

async function saveGrade() {
  const submission = state.submissions.find(s => s.id === state.gradingSub);
  const exam = state.exams.find(e => e.id === submission.examId);

  const perQuestion = { ...(submission.perQuestion || {}), ...state.gradingScores };
  let totalScore = 0;

  const questions = exam ? exam.questions : [];
  questions.forEach(q => {
    totalScore += Number(perQuestion[q.id]) || 0;
  });

  const feedbackText = document.getElementById('fbText').value;

  try {
    await db.collection('submissions').doc(submission.id).update({
      perQuestion: perQuestion,
      totalScore: totalScore,
      status: 'graded',
      feedback: feedbackText,
      gradedAt: Date.now()
    });

    go('adminDash');
  } catch (e) {
    const reason = (e && (e.code || e.message)) || 'unknown error';
    state.err = 'Could not save grade: ' + reason;
    render();
  }
}

render();
initDb();
</script>
