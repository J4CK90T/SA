<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teacher Exams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Firebase (free Spark plan) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f4f7fe;--card:#ffffff;--text:#12163a;--sub:#6b7280;--sub2:#9aa3bd;--border:#e7ebf7;
  --accent:#2f6fed;--accent2:#1d54c4;--accentSoft:#e8f0ff;
  --orange:#ff9f43;--orangeSoft:#fff1e0;
  --ok:#16a34a;--okSoft:#e8fbf0;--warn:#d97706;--warnSoft:#fff4e0;--danger:#e11d48;--dangerSoft:#fee9ee;
  --radius:20px;--shadow:0 2px 8px rgba(20,30,70,.05),0 10px 24px -12px rgba(20,30,70,.12);
}
:root[data-theme="dark"]{
  --bg:#0c1020;--card:#151b2e;--text:#eef1fb;--sub:#9aa3c2;--sub2:#6a7291;--border:#242c44;
  --accentSoft:#1b2440;--orangeSoft:#2c2010;--okSoft:#0f2a1c;--warnSoft:#2c220a;--dangerSoft:#301420;
  --shadow:0 2px 8px rgba(0,0,0,.3),0 10px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);min-height:100%;transition:background .2s,color .2s;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3{font-family:'Space Grotesk','Inter',sans-serif;letter-spacing:-.02em;margin:0;}
.navbar{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--border);
  padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.navbrand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:17px;color:var(--text);}
.navbrand .ic{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--orange));display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.navright{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.navavatar{display:flex;align-items:center;gap:8px;}
.navavatar .nm{font-weight:700;font-size:13px;line-height:1.2;}
.themebtn{background:var(--accentSoft);color:var(--accent);border:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;margin:0;box-shadow:none;padding:0;transition:transform .15s;}
.themebtn:hover{transform:scale(1.1);}
.wrap{max-width:800px;margin:0 auto;padding:26px 18px 44px;animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.stg{animation:fadein .4s ease both;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.topbar h1{font-size:22px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:16px;}
.hero{text-align:center;padding:48px 26px;}
.hero .badge{display:inline-block;background:var(--orangeSoft);color:var(--orange);padding:6px 16px;border-radius:999px;font-size:12.5px;font-weight:800;margin-bottom:16px;}
.hero h1{font-size:32px;color:var(--text);margin-bottom:10px;}
.hero p{color:var(--sub);margin:0 0 26px;font-size:15.5px;max-width:440px;margin-left:auto;margin-right:auto;}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px;}
.chip{background:var(--accentSoft);color:var(--accent);padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:700;}
.banner{display:flex;align-items:center;gap:14px;padding:16px 20px;border:1.5px solid var(--accent);background:var(--accentSoft);flex-wrap:wrap;}
.banner .bic{font-size:26px;}
.banner .btext{flex:1;min-width:120px;}
.banner .btext b{display:block;font-size:10.5px;text-transform:uppercase;color:var(--accent);letter-spacing:.05em;}
.banner .btext div{font-weight:700;font-size:15px;color:var(--text);margin-top:2px;}
label{display:block;font-size:11.5px;color:var(--sub);margin:14px 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
input[type=text],input[type=password],input[type=number],textarea,select{
  width:100%;padding:12px 14px;border-radius:13px;border:1.5px solid var(--border);
  background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;transition:.15s;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accentSoft);}
textarea{min-height:84px;resize:vertical;}
button{
  cursor:pointer;border:none;border-radius:999px;padding:12px 22px;font-size:14.5px;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;margin-top:12px;margin-right:8px;
  transition:transform .12s,box-shadow .15s;box-shadow:0 6px 16px -6px rgba(47,111,237,.45);
}
button:hover{transform:translateY(-2px);}
button:active{transform:translateY(0);}
button.secondary{background:var(--accentSoft);color:var(--accent);box-shadow:none;}
button.secondary:hover{background:var(--accent);color:#fff;}
button.orange{background:linear-gradient(135deg,var(--orange),#ff8021);box-shadow:0 6px 16px -6px rgba(255,159,67,.5);}
button.danger{background:var(--dangerSoft);color:var(--danger);box-shadow:none;border:1px solid rgba(225,29,72,.25);}
button.danger:hover{background:var(--danger);color:#fff;}
button.ghost{background:transparent;color:var(--sub);border:1.5px solid var(--border);box-shadow:none;}
button.ghost:hover{background:var(--accentSoft);color:var(--text);transform:none;}
button.big{width:100%;padding:16px;font-size:16px;}
button.toggle{background:var(--accentSoft);color:var(--sub);border:1.5px solid var(--border);box-shadow:none;padding:12px 18px;}
button.toggle.on-ok{background:var(--okSoft);color:var(--ok);border-color:var(--ok);}
button.toggle.on-bad{background:var(--dangerSoft);color:var(--danger);border-color:var(--danger);}
.tabs{display:flex;gap:6px;background:var(--bg);border-radius:14px;padding:5px;margin-bottom:16px;}
.tabs button{flex:1;margin:0;background:transparent;color:var(--sub);border-radius:10px;padding:10px;box-shadow:none;}
.tabs button.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow);}
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:800;}
.pill.ok{background:var(--okSoft);color:var(--ok);}
.pill.warn{background:var(--warnSoft);color:var(--warn);}
.pill.sub{background:var(--accentSoft);color:var(--accent);}
.small{color:var(--sub);font-size:13px;}
.searchbar{position:relative;margin-bottom:16px;}
.searchbar input{padding-left:40px;}
.searchbar .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--sub2);font-size:15px;}
.progresscard{display:flex;gap:22px;flex-wrap:wrap;align-items:center;}
.progresscard .pstat{flex:1;min-width:140px;}
.pbig{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:800;color:var(--text);}
.pbar{height:8px;border-radius:99px;background:var(--border);margin-top:8px;overflow:hidden;}
.pbar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--orange));transition:width .6s ease;}
.achv{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;}
.abadge{flex:0 0 auto;text-align:center;padding:14px 16px;border-radius:16px;min-width:88px;border:1px solid var(--border);background:var(--card);opacity:.4;filter:grayscale(1);}
.abadge.on{opacity:1;filter:none;background:linear-gradient(160deg,var(--accentSoft),var(--orangeSoft));border-color:var(--accent);box-shadow:var(--shadow);}
.abadge .aic{font-size:22px;}
.abadge .al{font-size:9.5px;color:var(--sub);font-weight:700;margin-top:4px;display:block;text-transform:uppercase;letter-spacing:.02em;}
.timerwrap{margin-bottom:20px;}
.timer{font-size:32px;font-weight:800;text-align:center;padding:20px;font-family:'Space Grotesk',sans-serif;letter-spacing:.03em;color:var(--text);}
.timer.low{color:var(--danger);}
.tbar{height:6px;border-radius:99px;background:var(--border);margin-top:14px;overflow:hidden;}
.tbar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--orange));transition:width 1s linear;}
.tbar.low>div{background:linear-gradient(90deg,var(--danger),#ff9db3);}
.qbox{border-top:1px solid var(--border);padding:18px 0;}
.qbox:first-child{border-top:none;padding-top:0;}
.qnum{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:9px;background:var(--accentSoft);color:var(--accent);font-weight:800;font-size:12.5px;margin-right:8px;}
.opt{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;margin:7px 0;border:1.5px solid var(--border);cursor:pointer;transition:.15s;}
.opt:hover{border-color:var(--accent);background:var(--accentSoft);}
.opt input{width:auto;accent-color:var(--accent);}
.err{color:var(--danger);font-size:13px;margin-top:10px;font-weight:700;background:var(--dangerSoft);padding:10px 12px;border-radius:10px;}
.rowflex{display:flex;gap:10px;flex-wrap:wrap;}
.rowflex>*{flex:1;min-width:130px;}
a.link{color:var(--accent);cursor:pointer;font-size:13.5px;font-weight:700;}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-top:1px solid var(--border);flex-wrap:wrap;}
.item:first-child{border-top:none;padding-top:0;}
.itemtitle{font-weight:700;font-size:15px;}
.avatar{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--orange));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-right:11px;flex-shrink:0;}
.itemrow{display:flex;align-items:center;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
@media (max-width:420px){.stats{grid-template-columns:1fr 1fr;}}
.stat{padding:18px 14px;text-align:center;}
.stat .n{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:800;color:var(--accent);}
.stat .l{font-size:10.5px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:4px;}
.empty{text-align:center;padding:30px 10px;color:var(--sub);}
.empty .ic{font-size:32px;margin-bottom:8px;}
.gscore{font-weight:800;font-family:'Space Grotesk',sans-serif;}
.overlay{position:fixed;inset:0;background:rgba(10,14,30,.55);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadein .2s ease;}
.modal{max-width:360px;width:100%;padding:26px;text-align:center;}
.modal .mic{font-size:32px;margin-bottom:10px;}
.lockbox{width:100%;background:var(--bg);border:1.5px dashed var(--border);border-radius:14px;padding:14px;margin-top:8px;}
</style>
</head>
<body>
<div class="navbar" id="navbar"></div>
<div class="wrap" id="app"></div>
<script>
/* ============================================================
   Your Firebase config (Project: online-quiz-a7f40)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyA2wqin7hWuBc91RcNqTWl_BKShDqUxPSE",
  authDomain: "online-quiz-a7f40.firebaseapp.com",
  projectId: "online-quiz-a7f40",
  storageBucket: "online-quiz-a7f40.firebasestorage.app",
  messagingSenderId: "410078796989",
  appId: "1:410078796989:web:a8ad955ceef10ef348ebd4"
};

let db=null, dbReady=false;
const GRADES=['Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Grade 7','Grade 8','Grade 9','Grade 10','Grade 11','Grade 12'];
let state={screen:'home', err:'', studentMode:'login',
  studentName:'', studentGrade:GRADES[0], studentSlug:'',
  exams:[], submissions:[], activeExam:null, currentAnswers:null,
  draftQuestions:[], newQ:{type:'mcq',text:'',options:'',points:10},
  examDraft:{title:'',grade:'',duration:120,isPrivate:false,password:''},
  timerLeft:0, timerInt:null, gradingSub:null, gradingScores:{}, gradingCorrect:{},
  studentSearch:'', adminSearch:'', deleteTarget:null,
  examErr:{}, unlockedExams:{}, theme:'light'};

try{
  const s=JSON.parse(localStorage.getItem('exam_student_session')||'null');
  if(s){state.studentName=s.name;state.studentGrade=s.grade;state.studentSlug=s.slug;}
}catch(e){}
try{
  const t=localStorage.getItem('exam_theme');
  if(t) state.theme=t;
  else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) state.theme='dark';
}catch(e){}
document.documentElement.setAttribute('data-theme', state.theme);

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function slugify(n){return n.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');}
function gradeOptions(sel){return GRADES.map(g=>`<option value="${g}" ${g===sel?'selected':''}>${g}</option>`).join('');}
function initials(n){ return (n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function toggleTheme(){ state.theme = state.theme==='dark'?'light':'dark'; try{localStorage.setItem('exam_theme',state.theme);}catch(e){} document.documentElement.setAttribute('data-theme', state.theme); render(); }

function renderNavbar(){
  const isAdminArea = ['adminLogin','adminDash','postExam','gradeSubmission'].includes(state.screen);
  const isStudentArea = ['studentDash','examTaking','submitted'].includes(state.screen) && state.studentName;
  let right = `<button class="themebtn" title="Toggle theme" onclick="toggleTheme()">${state.theme==='dark'?'☀️':'🌙'}</button>`;
  if(isStudentArea){
    right += `<div class="navavatar"><span class="avatar" style="margin:0">${initials(state.studentName)}</span><div><div class="nm">${esc(state.studentName)}</div><span class="small">${esc(state.studentGrade)}</span></div></div><a class="link" onclick="studentLogout()">Log out</a>`;
  } else if(isAdminArea){
    right += `<span class="pill sub">Admin</span><a class="link" onclick="go('home')">Log out</a>`;
  } else {
    right += `<button class="secondary" style="margin:0;padding:9px 16px;font-size:13px" onclick="go('adminLogin')">⚙️ Admin</button>`;
  }
  return `<div class="navbrand"><span class="ic">📚</span><span>Teacher Exams</span></div><div class="navright">${right}</div>`;
}

function render(){
  document.getElementById('navbar').innerHTML = renderNavbar();
  let html = views[state.screen]();
  if(state.deleteTarget){
    html += `<div class="overlay"><div class="modal card">
      <div class="mic">🗑️</div><h3>Delete this exam?</h3>
      <p class="small">This can't be undone. Students will no longer see it.</p>
      <button class="danger big" onclick="confirmDeleteExam()">Delete Exam</button>
      <button class="ghost big" onclick="state.deleteTarget=null;render();">Cancel</button>
    </div></div>`;
  }
  document.getElementById('app').innerHTML = html;
}
function go(screen){state.screen=screen;state.err='';render();}

function initDb(){
  try{
    if(firebaseConfig.apiKey==='YOUR_API_KEY'){
      state.err='Firebase is not configured yet — open the file and paste your project config near the top of the <script>.';
      render(); return;
    }
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    dbReady = true;
    db.collection('exams').onSnapshot(snap=>{ state.exams = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, e=>{state.err='Sync error: '+(e.code||e.message);render();});
    db.collection('submissions').onSnapshot(snap=>{ state.submissions = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, e=>{state.err='Sync error: '+(e.code||e.message);render();});
  }catch(e){state.err='Could not connect to Firebase: '+(e.message||e);render();}
}

function fmtTime(ms){
  if(ms<0)ms=0;
  const s=Math.floor(ms/1000);
  const h=String(Math.floor(s/3600)).padStart(2,'0');
  const m=String(Math.floor((s%3600)/60)).padStart(2,'0');
  const sec=String(s%60).padStart(2,'0');
  return h+':'+m+':'+sec;
}
function draftKey(examId,slug){return 'exam_draft_'+examId+'_'+slug;}
function loadDraft(examId,slug){ try{return JSON.parse(localStorage.getItem(draftKey(examId,slug))||'null');}catch(e){return null;} }
function saveDraft(examId,slug,data){ try{localStorage.setItem(draftKey(examId,slug),JSON.stringify(data));}catch(e){} }
function clearDraft(examId,slug){ try{localStorage.removeItem(draftKey(examId,slug));}catch(e){} }
function studentSubStatus(exam){ return state.submissions.find(s=>s.examId===exam.id && s.studentSlug===state.studentSlug) || null; }

function unlockedKey(){ return 'exam_unlocked_'+state.studentSlug; }
function isUnlocked(examId){
  if(state.unlockedExams[examId]) return true;
  try{ const arr = JSON.parse(localStorage.getItem(unlockedKey())||'[]'); return arr.includes(examId); }catch(e){ return false; }
}
function markUnlocked(examId){
  state.unlockedExams[examId]=true;
  try{
    const arr = JSON.parse(localStorage.getItem(unlockedKey())||'[]');
    if(!arr.includes(examId)){ arr.push(examId); localStorage.setItem(unlockedKey(), JSON.stringify(arr)); }
  }catch(e){}
}
function unlockExam(examId){
  const exam = state.exams.find(e=>e.id===examId);
  const el = document.getElementById('pw_'+examId);
  const val = el ? el.value : '';
  if(exam && val === exam.password){ markUnlocked(examId); state.examErr[examId]=''; }
  else { state.examErr[examId]='Incorrect password.'; }
  render();
}

function computeAchievements(){
  const subs = state.submissions.filter(s=>s.studentSlug===state.studentSlug);
  const graded = subs.filter(s=>s.status==='graded');
  const perfect = graded.some(s=>s.maxScore>0 && s.totalScore===s.maxScore);
  const avg = graded.length? graded.reduce((a,s)=>a+(s.totalScore/(s.maxScore||1)),0)/graded.length*100 : 0;
  return [
    {icon:'🚀',label:'First Exam',unlocked:subs.length>=1},
    {icon:'🔥',label:'3 Exams',unlocked:subs.length>=3},
    {icon:'🏆',label:'Perfect Score',unlocked:perfect},
    {icon:'⭐',label:'High Achiever',unlocked:avg>=90 && graded.length>0},
  ];
}

const views = {
home(){
  return `<div class="hero card">
    <span class="badge">✨ Premium Exam Platform</span>
    <h1>Teacher Exams</h1>
    <p>Sign up, take beautifully timed exams, track your progress, and unlock achievements — all in one place.</p>
    <button class="big" onclick="go('studentLogin')">Continue as Student →</button>
    <div class="chips">
      <span class="chip">⏱ Timed Exams</span>
      <span class="chip">🔒 Private Exams</span>
      <span class="chip">🏆 Achievements</span>
    </div>
    ${!dbReady?'<p class="small" style="margin-top:16px">Connecting…</p>':''}
    ${state.err?`<p class="err">${state.err}</p>`:''}
  </div>`;
},

studentLogin(){
  const mode=state.studentMode;
  return `<div class="topbar"><h1>${mode==='signup'?'Create Account':'Welcome Back'}</h1><a class="link" onclick="go('home')">← Back</a></div>
  <div class="card">
    <div class="tabs">
      <button class="${mode==='login'?'active':''}" onclick="state.studentMode='login';state.err='';render();">Log In</button>
      <button class="${mode==='signup'?'active':''}" onclick="state.studentMode='signup';state.err='';render();">Sign Up</button>
    </div>
    <label>Full name</label>
    <input type="text" id="sName" value="${esc(state.studentName)}" placeholder="e.g. Sara Ahmed">
    <label>Password</label>
    <input type="password" id="sPass" placeholder="Choose a password">
    ${mode==='signup'?`<label>Grade</label><select id="sGrade">${gradeOptions(state.studentGrade)}</select>`:''}
    ${state.err?`<p class="err">${state.err}</p>`:''}
    <button class="big" onclick="${mode==='signup'?'studentSignupSubmit()':'studentLoginSubmit()'}">${mode==='signup'?'Create Account':'Log In'}</button>
  </div>`;
},

studentDash(){
  const all = state.exams.filter(e=>e.grade===state.studentGrade);
  const q = state.studentSearch.trim().toLowerCase();
  const matched = q ? all.filter(e=>e.title.toLowerCase().includes(q)) : all;
  const mySubs = state.submissions.filter(s=>s.studentSlug===state.studentSlug);
  const attempted = all.filter(e=>mySubs.some(s=>s.examId===e.id)).length;
  const graded = mySubs.filter(s=>s.status==='graded');
  const avg = graded.length ? Math.round(graded.reduce((a,s)=>a+(s.totalScore/(s.maxScore||1)),0)/graded.length*100) : null;
  const achv = computeAchievements();
  const nextExam = all.find(e=>!studentSubStatus(e) && !loadDraft(e.id,state.studentSlug) && !(e.isPrivate && !isUnlocked(e.id)));
  return `<h1 style="margin-bottom:18px">Welcome back, ${esc(state.studentName)} 👋</h1>
  ${nextExam?`<div class="card banner"><div class="bic">🎯</div><div class="btext"><b>Next Up</b><div>${esc(nextExam.title)}</div></div><button onclick="startExam('${nextExam.id}')">Start</button></div>`:''}
  <div class="card progresscard">
    <div class="pstat"><span class="small">Exams Completed</span><div class="pbig">${attempted}/${all.length}</div><div class="pbar"><div style="width:${all.length?attempted/all.length*100:0}%"></div></div></div>
    <div class="pstat"><span class="small">Average Score</span><div class="pbig">${avg===null?'—':avg+'%'}</div><div class="pbar"><div style="width:${avg||0}%"></div></div></div>
  </div>
  <div class="achv">${achv.map(a=>`<div class="abadge ${a.unlocked?'on':''}"><div class="aic">${a.icon}</div><span class="al">${a.label}</span></div>`).join('')}</div>
  <div class="searchbar"><span class="ic">🔍</span><input type="text" placeholder="Search exams..." value="${esc(state.studentSearch)}" oninput="state.studentSearch=this.value;render();"></div>
  ${matched.length===0?`<div class="card empty"><div class="ic">🗒️</div>${all.length===0?'No exams available for your grade yet.':'No exams match your search.'}</div>`:matched.map((exam,i)=>{
    const sub = studentSubStatus(exam);
    const draft = !sub ? loadDraft(exam.id, state.studentSlug) : null;
    const locked = exam.isPrivate && !sub && !draft && !isUnlocked(exam.id);
    let statusHtml, actionHtml;
    if(locked){
      statusHtml = `<span class="pill warn">🔒 Private</span>`;
      actionHtml = `<div class="lockbox"><input type="password" id="pw_${exam.id}" placeholder="Enter exam password">${state.examErr[exam.id]?`<p class="err" style="margin-top:8px">${esc(state.examErr[exam.id])}</p>`:''}<button onclick="unlockExam('${exam.id}')">🔓 Unlock Exam</button></div>`;
    } else if(sub && sub.status==='graded'){
      statusHtml = `<span class="pill ok">✓ Graded — ${sub.totalScore}/${sub.maxScore}</span>`;
      actionHtml = '';
    } else if(sub){
      statusHtml = `<span class="pill sub">⏳ Awaiting grade</span>`; actionHtml='';
    } else if(draft){
      statusHtml = `<span class="pill warn">◐ In progress</span>`;
      actionHtml = `<button onclick="resumeExam('${exam.id}')">Resume</button>`;
    } else {
      statusHtml = `<span class="small">${exam.durationMinutes||120} min · ${exam.questions.length} question(s)</span>`;
      actionHtml = `<button onclick="startExam('${exam.id}')">Start Exam</button>`;
    }
    return `<div class="card stg" style="animation-delay:${i*0.05}s"><div class="item"><div><div class="itemtitle">${exam.isPrivate?'🔒 ':''}${esc(exam.title)}</div>${statusHtml}</div>${locked?'':actionHtml}</div>${locked?actionHtml:''}${sub&&sub.status==='graded'&&sub.feedback?`<p class="small" style="margin:8px 0 0">💬 ${esc(sub.feedback)}</p>`:''}</div>`;
  }).join('')}`;
},

examTaking(){
  const exam = state.activeExam;
  if(!exam) return `<div class="card">No active exam. <a class="link" onclick="go('studentDash')">Go back</a></div>`;
  const low = state.timerLeft < 5*60*1000;
  const pct = Math.max(0,Math.min(100, state.timerLeft/((exam.durationMinutes||120)*60000)*100));
  return `<div class="topbar"><h1>${esc(exam.title)}</h1></div>
  <div class="timerwrap card"><div class="timer ${low?'low':''}">⏱ ${fmtTime(state.timerLeft)}</div><div class="tbar ${low?'low':''}"><div style="width:${pct}%"></div></div></div>
  <div class="card">
    ${exam.questions.map((q,i)=>`
      <div class="qbox">
        <p><span class="qnum">${i+1}</span><b>${q.points||10} pts</b> — ${esc(q.text)}</p>
        ${q.type==='mcq'
          ? q.options.map((opt,oi)=>`<label class="opt"><input type="radio" name="q_${q.id}" value="${oi}" ${state.currentAnswers && state.currentAnswers[q.id]==oi?'checked':''} onchange="answerChanged('${q.id}', this.value)"><span>${esc(opt)}</span></label>`).join('')
          : `<textarea onchange="answerChanged('${q.id}', this.value)" placeholder="Write your answer...">${esc((state.currentAnswers&&state.currentAnswers[q.id])||'')}</textarea>`}
      </div>`).join('')}
    <button onclick="submitExam()">Submit Exam</button>
    <button class="ghost" onclick="saveAndExit()">Save & Exit</button>
  </div>`;
},

submitted(){
  return `<div class="card hero"><div style="font-size:46px">✅</div><h2>Exam submitted!</h2><p>Your exam has been sent to your teacher for grading. Check back later for your grade.</p><button onclick="go('studentDash')">Back to My Exams</button></div>`;
},

adminLogin(){
  return `<div class="topbar"><h1>Admin Login</h1><a class="link" onclick="go('home')">← Back</a></div>
  <div class="card">
    <label>Username</label><input type="text" id="aUser" placeholder="Username">
    <label>Password</label><input type="password" id="aPass" placeholder="Password">
    ${state.err?`<p class="err">${state.err}</p>`:''}
    <button class="big" onclick="adminLoginSubmit()">Log In</button>
  </div>`;
},

adminDash(){
  const ungraded = state.submissions.filter(s=>s.status==='submitted');
  const graded = state.submissions.filter(s=>s.status==='graded');
  const q = state.adminSearch.trim().toLowerCase();
  const examsFiltered = q ? state.exams.filter(e=>e.title.toLowerCase().includes(q)) : state.exams;
  return `<h1 style="margin-bottom:18px">Admin Dashboard</h1>
  <div class="stats">
    <div class="stat card"><div class="n">${state.exams.length}</div><div class="l">Exams</div></div>
    <div class="stat card"><div class="n">${ungraded.length}</div><div class="l">To Grade</div></div>
    <div class="stat card"><div class="n">${graded.length}</div><div class="l">Graded</div></div>
  </div>
  <div class="card"><button class="big orange" onclick="startPostExam()">+ Post New Exam</button></div>
  <div class="card"><h3 style="margin-bottom:12px">Posted Exams</h3>
    <div class="searchbar"><span class="ic">🔍</span><input type="text" placeholder="Search exams..." value="${esc(state.adminSearch)}" oninput="state.adminSearch=this.value;render();"></div>
    ${examsFiltered.length===0?'<p class="small">No exams found.</p>':examsFiltered.map(e=>`
      <div class="item"><div><div class="itemtitle">${e.isPrivate?'🔒 ':''}${esc(e.title)}</div><span class="small">${esc(e.grade)} · ${e.durationMinutes||120} min · ${e.questions.length} question(s)</span></div><button class="danger" onclick="deleteExam('${e.id}')">Delete</button></div>`).join('')}
  </div>
  <div class="card"><h3 style="margin-bottom:12px">Ungraded Submissions</h3>
    ${ungraded.length===0?'<p class="small">Nothing to grade. 🎉</p>':ungraded.map(s=>`
      <div class="item"><div class="itemrow"><span class="avatar">${initials(s.studentName)}</span><div><div class="itemtitle">${esc(s.studentName)}</div><span class="small">${esc(s.examTitle)}</span></div></div><button onclick="openGrade('${s.id}')">Grade</button></div>`).join('')}
  </div>
  <div class="card"><h3 style="margin-bottom:12px">Graded Submissions</h3>
    ${graded.length===0?'<p class="small">None yet.</p>':graded.map(s=>`
      <div class="item"><div class="itemrow"><span class="avatar">${initials(s.studentName)}</span><div><div class="itemtitle">${esc(s.studentName)}</div><span class="small">${esc(s.examTitle)} — <b class="gscore">${s.totalScore}/${s.maxScore}</b></span></div></div><button class="ghost" onclick="openGrade('${s.id}')">Review</button></div>`).join('')}
  </div>`;
},

postExam(){
  const q = state.newQ;
  return `<div class="topbar"><h1>Post New Exam</h1><a class="link" onclick="go('adminDash')">← Back</a></div>
  <div class="card">
    <label>Exam title</label><input type="text" id="exTitle" value="${esc(state.examDraft.title)}" oninput="state.examDraft.title=this.value" placeholder="e.g. Midterm English">
    <div class="rowflex">
      <div><label>Grade</label><select id="exGrade" onchange="state.examDraft.grade=this.value">${gradeOptions(state.examDraft.grade||GRADES[0])}</select></div>
      <div><label>Duration (min)</label><input type="number" id="exDuration" value="${state.examDraft.duration}" oninput="state.examDraft.duration=this.value"></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:16px">
      <input type="checkbox" id="exPrivate" ${state.examDraft.isPrivate?'checked':''} onchange="state.examDraft.isPrivate=this.checked;render();" style="width:auto">
      <span style="text-transform:none;font-weight:600;color:var(--text);font-size:14px">🔒 Make this exam private (requires a password)</span>
    </label>
    ${state.examDraft.isPrivate?`<label>Exam password</label><input type="text" id="exPassword" value="${esc(state.examDraft.password)}" oninput="state.examDraft.password=this.value" placeholder="Password students must enter">`:''}
  </div>
  <div class="card">
    <h3 style="margin-bottom:12px">Add Question</h3>
    <label>Type</label>
    <select id="qType" onchange="state.newQ.type=this.value;render();">
      <option value="mcq" ${q.type==='mcq'?'selected':''}>Multiple Choice</option>
      <option value="essay" ${q.type==='essay'?'selected':''}>Essay</option>
    </select>
    <label>Question text</label>
    <textarea id="qText" placeholder="Question...">${esc(q.text)}</textarea>
    ${q.type==='mcq'?`<label>Options (one per line)</label><textarea id="qOptions" placeholder="Option A
Option B
Option C">${esc(q.options)}</textarea>`:''}
    <label>Points</label><input type="number" id="qPoints" value="${q.points}">
    <button onclick="addQuestion()">+ Add Question</button>
  </div>
  <div class="card"><h3 style="margin-bottom:12px">Questions in this exam (${state.draftQuestions.length})</h3>
    ${state.draftQuestions.length===0?'<p class="small">No questions added yet.</p>':state.draftQuestions.map((qq,i)=>`
      <div class="item"><div><span class="qnum">${i+1}</span><span class="small">(${qq.type}, ${qq.points}pts)</span><div class="small" style="margin-top:4px">${esc(qq.text)}</div></div><button class="danger" onclick="removeQuestion(${i})">Remove</button></div>`).join('')}
  </div>
  ${state.err?`<p class="err">${state.err}</p>`:''}
  <button class="big" onclick="publishExam()">Publish Exam</button>`;
},

gradeSubmission(){
  const sub = state.submissions.find(s=>s.id===state.gradingSub);
  if(!sub) return `<div class="card">Submission not found. <a class="link" onclick="go('adminDash')">Back</a></div>`;
  const exam = state.exams.find(e=>e.id===sub.examId);
  const liveTotal = (exam?exam.questions:[]).reduce((a,q)=>{
    const c = state.gradingCorrect[q.id];
    return a + (c===true?(q.points||10):0);
  },0);
  const maxT = (exam?exam.questions:[]).reduce((a,q)=>a+(q.points||10),0);
  return `<div class="topbar"><div class="itemrow"><span class="avatar">${initials(sub.studentName)}</span><div><h1>${esc(sub.studentName)}</h1><span class="small">${esc(sub.examTitle)}</span></div></div><a class="link" onclick="go('adminDash')">← Back</a></div>
  <div class="card" style="text-align:center"><span class="small">Live total</span><div class="gscore" style="font-size:30px">${liveTotal} / ${maxT}</div></div>
  <div class="card">
    ${(exam?exam.questions:[]).map((q,i)=>{
      const ans = sub.answers[q.id];
      const shown = q.type==='mcq' ? (q.options[ans]!==undefined?esc(q.options[ans]):'<i>No answer</i>') : (ans?esc(ans):'<i>No answer</i>');
      const c = state.gradingCorrect[q.id];
      return `<div class="qbox">
        <p><span class="qnum">${i+1}</span><b>${q.points||10} pts</b> — ${esc(q.text)}</p>
        <p class="small" style="background:var(--bg);padding:11px 13px;border-radius:12px">${shown}</p>
        <div class="rowflex">
          <button class="toggle ${c===true?'on-ok':''}" onclick="setCorrect('${q.id}', ${q.points||10}, true)">✓ Correct (${q.points||10} pts)</button>
          <button class="toggle ${c===false?'on-bad':''}" onclick="setCorrect('${q.id}', ${q.points||10}, false)">✗ Incorrect (0 pts)</button>
        </div>
      </div>`;
    }).join('')}
    <label>Feedback (optional)</label>
    <textarea id="fbText" placeholder="Feedback to student...">${esc(sub.feedback||'')}</textarea>
    ${state.err?`<p class="err">${state.err}</p>`:''}
    <button class="big" onclick="saveGrade()">Save Grade</button>
  </div>`;
}
};

function setCorrect(qid, points, val){ state.gradingCorrect[qid]=val; state.gradingScores[qid]= val ? points : 0; render(); }

async function studentSignupSubmit(){
  const name=document.getElementById('sName').value.trim();
  const pass=document.getElementById('sPass').value;
  const grade=document.getElementById('sGrade').value;
  if(!name||!pass){state.err='Please enter your name and a password.';render();return;}
  const slug=slugify(name);
  if(!slug){state.err='Please enter a valid name.';render();return;}
  if(!db){state.err='Still connecting — please wait a moment and try again.';render();return;}
  try{
    const ref=db.doc('students/'+slug);
    const snap=await ref.get();
    if(snap.exists){state.err='That name is already registered. Try logging in instead.';render();return;}
    await ref.set({name,password:pass,grade,createdAt:Date.now()});
    state.studentName=name;state.studentGrade=grade;state.studentSlug=slug;
    try{localStorage.setItem('exam_student_session',JSON.stringify({name,grade,slug}));}catch(e){}
    go('studentDash');
  }catch(e){const reason=(e&&(e.code||e.message))||'unknown error';state.err='Could not sign up: '+reason;render();}
}
async function studentLoginSubmit(){
  const name=document.getElementById('sName').value.trim();
  const pass=document.getElementById('sPass').value;
  if(!name||!pass){state.err='Please enter your name and password.';render();return;}
  const slug=slugify(name);
  if(!db){state.err='Still connecting — please wait a moment and try again.';render();return;}
  try{
    const snap=await db.doc('students/'+slug).get();
    if(!snap.exists){state.err='No account found. Please sign up first.';render();return;}
    const d=snap.data();
    if(d.password!==pass){state.err='Incorrect password.';render();return;}
    state.studentName=d.name;state.studentGrade=d.grade;state.studentSlug=slug;
    try{localStorage.setItem('exam_student_session',JSON.stringify({name:d.name,grade:d.grade,slug}));}catch(e){}
    go('studentDash');
  }catch(e){const reason=(e&&(e.code||e.message))||'unknown error';state.err='Could not log in: '+reason;render();}
}
function studentLogout(){
  state.studentName='';state.studentSlug='';
  try{localStorage.removeItem('exam_student_session');}catch(e){}
  go('home');
}

function adminLoginSubmit(){
  const u=document.getElementById('aUser').value, p=document.getElementById('aPass').value;
  if(u==='MRUSER' && p==='MRPASSWORD'){ go('adminDash'); }
  else { state.err='Incorrect username or password.'; render(); }
}
function startPostExam(){ state.draftQuestions=[]; state.newQ={type:'mcq',text:'',options:'',points:10}; state.examDraft={title:'',grade:GRADES[0],duration:120,isPrivate:false,password:''}; go('postExam'); }
function addQuestion(){
  const text=document.getElementById('qText').value.trim();
  const points=Number(document.getElementById('qPoints').value)||10;
  const type=document.getElementById('qType').value;
  if(!text){state.err='Question text required.';render();return;}
  let q={id:'q'+Date.now()+Math.random().toString(36).slice(2,7), type, text, points};
  if(type==='mcq'){
    const opts=document.getElementById('qOptions').value.split('\n').map(o=>o.trim()).filter(Boolean);
    if(opts.length<2){state.err='Add at least 2 options.';render();return;}
    q.options=opts;
  }
  state.draftQuestions.push(q);
  state.newQ={type:'mcq',text:'',options:'',points:10};
  state.err=''; render();
}
function removeQuestion(i){state.draftQuestions.splice(i,1);render();}
async function publishExam(){
  const title=(state.examDraft.title||'').trim();
  const grade=state.examDraft.grade||GRADES[0];
  const duration=Number(state.examDraft.duration)||120;
  const isPrivate=!!state.examDraft.isPrivate;
  const password=(state.examDraft.password||'').trim();
  if(!title){state.err='Title is required.';render();return;}
  if(state.draftQuestions.length===0){state.err='Add at least one question.';render();return;}
  if(isPrivate && !password){state.err='Set a password for this private exam.';render();return;}
  if(!db){state.err='Still connecting to storage — please wait a moment and try again.';render();return;}
  try{
    await db.collection('exams').add({title,grade,durationMinutes:duration,questions:state.draftQuestions,isPrivate,password:isPrivate?password:'',createdAt:Date.now()});
    go('adminDash');
  }catch(e){
    const reason = (e && (e.code || e.message)) || 'unknown error';
    state.err='Could not save exam: '+reason; render();
  }
}
function deleteExam(id){ state.deleteTarget=id; render(); }
async function confirmDeleteExam(){
  const id=state.deleteTarget; state.deleteTarget=null;
  try{ await db.collection('exams').doc(id).delete(); }
  catch(e){ const reason=(e&&(e.code||e.message))||'unknown error'; state.err='Could not delete exam: '+reason; }
  render();
}

function startExam(examId){
  const exam = state.exams.find(e=>e.id===examId);
  const startedAt = Date.now();
  saveDraft(examId, state.studentSlug, {answers:{}, startedAt});
  state.activeExam=exam; state.currentAnswers={};
  beginTimer(exam, startedAt); go('examTaking');
}
function resumeExam(examId){
  const exam = state.exams.find(e=>e.id===examId);
  const d = loadDraft(examId, state.studentSlug);
  state.activeExam=exam; state.currentAnswers=(d&&d.answers)||{};
  beginTimer(exam, (d&&d.startedAt)||Date.now()); go('examTaking');
}
function beginTimer(exam, startedAt){
  if(state.timerInt) clearInterval(state.timerInt);
  const durMs = (exam.durationMinutes||120)*60000;
  function tick(){
    state.timerLeft = startedAt+durMs-Date.now();
    if(state.timerLeft<=0){ clearInterval(state.timerInt); submitExam(true); }
    else if(state.screen==='examTaking'){
      const pct = Math.max(0,Math.min(100, state.timerLeft/durMs*100));
      const low = state.timerLeft < 5*60*1000;
      document.querySelectorAll('.timer').forEach(t=>{ t.textContent='⏱ '+fmtTime(state.timerLeft); t.className='timer'+(low?' low':''); });
      document.querySelectorAll('.tbar').forEach(b=>{ b.className='tbar'+(low?' low':''); b.firstElementChild.style.width=pct+'%'; });
    }
  }
  tick(); state.timerInt=setInterval(tick,1000);
}
function answerChanged(qid,val){
  if(!state.currentAnswers) state.currentAnswers={};
  state.currentAnswers[qid]=val;
  const elapsed=(state.activeExam.durationMinutes||120)*60000 - state.timerLeft;
  saveDraft(state.activeExam.id, state.studentSlug, {answers:state.currentAnswers, startedAt: Date.now()-elapsed});
}
function saveAndExit(){ if(state.timerInt) clearInterval(state.timerInt); go('studentDash'); }
async function submitExam(auto){
  if(state.timerInt) clearInterval(state.timerInt);
  const exam = state.activeExam;
  const maxScore = exam.questions.reduce((a,q)=>a+(q.points||10),0);
  try{
    await db.collection('submissions').add({
      examId: exam.id, examTitle: exam.title, studentSlug: state.studentSlug, studentName: state.studentName, studentGrade: state.studentGrade,
      answers: state.currentAnswers||{}, submittedAt: Date.now(), status:'submitted',
      perQuestion:{}, totalScore:null, maxScore, feedback:'', auto: !!auto
    });
    clearDraft(exam.id, state.studentSlug); go('submitted');
  }catch(e){ const reason=(e&&(e.code||e.message))||'unknown error'; state.err='Could not submit: '+reason; render(); }
}
function openGrade(subId){
  const sub = state.submissions.find(s=>s.id===subId);
  const exam = state.exams.find(e=>e.id===sub.examId);
  state.gradingSub=subId; state.gradingScores={}; state.gradingCorrect={};
  if(sub && sub.perQuestion && exam){
    exam.questions.forEach(q=>{
      const sc = sub.perQuestion[q.id];
      if(sc!==undefined){ state.gradingCorrect[q.id] = sc >= (q.points||10); state.gradingScores[q.id]=sc; }
    });
  }
  go('gradeSubmission');
}
async function saveGrade(){
  const sub = state.submissions.find(s=>s.id===state.gradingSub);
  const exam = state.exams.find(e=>e.id===sub.examId);
  const perQuestion = {...(sub.perQuestion||{}), ...state.gradingScores};
  let total=0;
  (exam?exam.questions:[]).forEach(q=>{ total += Number(perQuestion[q.id])||0; });
  const feedback = document.getElementById('fbText').value;
  try{
    await db.collection('submissions').doc(sub.id).update({perQuestion, totalScore: total, status:'graded', feedback, gradedAt: Date.now()});
    go('adminDash');
  }catch(e){ const reason=(e&&(e.code||e.message))||'unknown error'; state.err='Could not save grade: '+reason; render(); }
}

render();
initDb();
</script>
</body>
</html>
